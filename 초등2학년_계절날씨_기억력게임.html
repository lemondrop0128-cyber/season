<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>초등 2학년 우리나라 계절과 날씨 기억력 게임</title>
  <style>
    :root {
      --bg-color: #f4f9ff;
      --text-color: #222b45;
      --spring-bg: #fff0f5;
      --spring-border: #ff85a2;
      --spring-accent: #e0457b;
      --summer-bg: #eafaf1;
      --summer-border: #4cd137;
      --summer-accent: #1b8a3d;
      --autumn-bg: #fff5eb;
      --autumn-border: #f39c12;
      --autumn-accent: #c86400;
      --winter-bg: #eef7ff;
      --winter-border: #54a0ff;
      --winter-accent: #1e62d0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    header {
      width: 100%;
      max-width: 960px;
      background: #ffffff;
      border-radius: 20px;
      padding: 18px 24px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.06);
      margin-bottom: 14px;
      border: 2px solid #dce8f7;
    }

    .title-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 1.55rem;
      color: #19376d;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    button {
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 12px;
      border: 2px solid #cbd5e1;
      background: #ffffff;
      color: #334155;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    button:hover {
      background: #f1f5f9;
      transform: translateY(-1px);
    }

    button.active {
      background: #2563eb;
      color: #ffffff;
      border-color: #1d4ed8;
    }

    button.restart-btn {
      background: #ff7675;
      color: #ffffff;
      border-color: #d63031;
    }

    button.restart-btn:hover {
      background: #e66767;
    }

    .status-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: #f8fafc;
      padding: 10px 16px;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
    }

    .stats {
      display: flex;
      gap: 18px;
      font-size: 1.05rem;
      font-weight: 700;
      color: #334155;
    }

    .stats span.highlight {
      color: #2563eb;
    }

    .feedback-banner {
      flex: 1;
      min-width: 260px;
      text-align: center;
      font-size: 1.05rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 10px;
      background: #eef2ff;
      color: #3730a3;
    }

    .feedback-banner.success {
      background: #dcfce7;
      color: #166534;
    }

    .feedback-banner.retry {
      background: #fef3c7;
      color: #92400e;
    }

    .guide-text {
      width: 100%;
      max-width: 960px;
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      color: #475569;
    }

    .badge-dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }

    .board-container {
      width: 100%;
      max-width: 960px;
      display: grid;
      gap: 12px;
      margin-bottom: 20px;
    }

    .board-4x4 {
      grid-template-columns: repeat(4, 1fr);
    }

    .board-6x4 {
      grid-template-columns: repeat(6, 1fr);
    }

    @media (max-width: 768px) {
      .board-6x4 {
        grid-template-columns: repeat(4, 1fr);
      }
      h1 {
        font-size: 1.25rem;
      }
    }

    .card {
      perspective: 1000px;
      height: 145px;
      cursor: pointer;
    }

    .board-6x4 .card {
      height: 132px;
    }

    .card-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.45s cubic-bezier(0.4, 0.2, 0.2, 1);
      border-radius: 16px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
    }

    .card.flipped .card-inner,
    .card.matched .card-inner {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 10px;
      text-align: center;
    }

    .card-back {
      background: #4f46e5;
      color: #ffffff;
      border: 3px solid #3730a3;
    }

    .card-back.season-hint {
      background: #f59e0b;
      border-color: #d97706;
    }

    .card-back.weather-hint {
      background: #3b82f6;
      border-color: #1d4ed8;
    }

    .card-back-icon {
      font-size: 2.1rem;
      margin-bottom: 4px;
    }

    .card-back-label {
      font-size: 0.9rem;
      font-weight: 700;
      opacity: 0.95;
    }

    .card-front {
      transform: rotateY(180deg);
      background: #ffffff;
      border: 3px solid #cbd5e1;
    }

    .card-front.spring {
      background: var(--spring-bg);
      border-color: var(--spring-border);
    }
    .card-front.summer {
      background: var(--summer-bg);
      border-color: var(--summer-border);
    }
    .card-front.autumn {
      background: var(--autumn-bg);
      border-color: var(--autumn-border);
    }
    .card-front.winter {
      background: var(--winter-bg);
      border-color: var(--winter-border);
    }

    .card.matched .card-front {
      box-shadow: 0 0 0 3px #22c55e inset;
    }

    .card-tag {
      font-size: 0.75rem;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 99px;
      margin-bottom: 4px;
    }

    .spring .card-tag { background: #ffd6e0; color: var(--spring-accent); }
    .summer .card-tag { background: #c8f7dc; color: var(--summer-accent); }
    .autumn .card-tag { background: #fdebd0; color: var(--autumn-accent); }
    .winter .card-tag { background: #d6eaff; color: var(--winter-accent); }

    .card-emoji {
      font-size: 2.1rem;
      line-height: 1.1;
      margin-bottom: 4px;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 800;
      color: #1e293b;
      line-height: 1.25;
      word-break: keep-all;
    }

    .card-desc {
      font-size: 0.78rem;
      font-weight: 600;
      color: #475569;
      margin-top: 3px;
      line-height: 1.2;
      word-break: keep-all;
    }

    /* 계절 바구니 현황판 */
    .season-summary {
      width: 100%;
      max-width: 960px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    @media (max-width: 640px) {
      .season-summary {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .season-box {
      background: #ffffff;
      border-radius: 14px;
      padding: 10px 12px;
      border: 2px solid #e2e8f0;
      min-height: 92px;
    }

    .season-box.spring { border-color: var(--spring-border); background: #fff9fb; }
    .season-box.summer { border-color: var(--summer-border); background: #f6fef9; }
    .season-box.autumn { border-color: var(--autumn-border); background: #fffaf5; }
    .season-box.winter { border-color: var(--winter-border); background: #f7fbff; }

    .season-box-header {
      font-weight: 800;
      font-size: 0.95rem;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }

    .collected-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.84rem;
      font-weight: 600;
      color: #334155;
    }

    .collected-item {
      background: #ffffff;
      padding: 3px 8px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
    }

    /* 완료 모달 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-overlay.show {
      display: flex;
    }

    .modal-card {
      background: #ffffff;
      border-radius: 24px;
      max-width: 520px;
      width: 100%;
      padding: 28px;
      text-align: center;
      border: 4px solid #3b82f6;
    }

    .modal-card h2 {
      font-size: 1.75rem;
      color: #1d4ed8;
      margin-bottom: 10px;
    }

    .modal-card p {
      font-size: 1.05rem;
      color: #334155;
      margin-bottom: 18px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <header>
    <div class="title-row">
      <h1>☀️ 우리나라 계절과 날씨 카드 뒤집기</h1>
      <div class="controls">
        <button id="mode-8" class="active" onclick="setMode(2)">보통 (계절당 2개·16장)</button>
        <button id="mode-12" onclick="setMode(3)">확장 (계절당 3개·24장)</button>
        <button id="hint-toggle" class="active" onclick="toggleBackHint()">뒷면 구분: 켜짐</button>
        <button id="sound-toggle" class="active" onclick="toggleSound()">🔊 소리 켜짐</button>
        <button class="restart-btn" onclick="initGame()">🔄 다시 시작</button>
      </div>
    </div>
    <div class="status-bar">
      <div class="stats">
        <div>찾은 짝: <span id="matched-count" class="highlight">0</span> / <span id="total-pairs">8</span></div>
        <div>뒤집은 횟수: <span id="move-count" class="highlight">0</span>번</div>
      </div>
      <div id="feedback" class="feedback-banner">
        계절 카드(⭐) 1장과 날씨 카드(☁️) 1장을 뒤집어 알맞은 계절과 날씨를 연결해 보세요!
      </div>
    </div>
  </header>

  <div class="guide-text" id="guide-row">
    <span><span class="badge-dot" style="background:#f59e0b;"></span>주황색 뒷면(⭐): <strong>계절 카드</strong> (봄·여름·가을·겨울)</span>
    <span><span class="badge-dot" style="background:#3b82f6;"></span>파란색 뒷면(☁️): <strong>기온과 날씨 현상 카드</strong></span>
  </div>

  <main id="game-board" class="board-container board-4x4"></main>

  <section class="season-summary">
    <div class="season-box spring">
      <div class="season-box-header"><span>🌸 봄 날씨</span><span id="count-spring">0개</span></div>
      <div class="collected-list" id="list-spring"></div>
    </div>
    <div class="season-box summer">
      <div class="season-box-header"><span>🌻 여름 날씨</span><span id="count-summer">0개</span></div>
      <div class="collected-list" id="list-summer"></div>
    </div>
    <div class="season-box autumn">
      <div class="season-box-header"><span>🍁 가을 날씨</span><span id="count-autumn">0개</span></div>
      <div class="collected-list" id="list-autumn"></div>
    </div>
    <div class="season-box winter">
      <div class="season-box-header"><span>⛄ 겨울 날씨</span><span id="count-winter">0개</span></div>
      <div class="collected-list" id="list-winter"></div>
    </div>
  </section>

  <div class="modal-overlay" id="win-modal">
    <div class="modal-card">
      <h2>🎉 참 잘했어요!</h2>
      <p id="win-message">우리나라 사계절의 날씨 특징을 모두 연결했어요!</p>
      <button class="active" onclick="closeModalAndRestart()" style="font-size:1.1rem; padding:12px 24px;">한 번 더 놀이하기</button>
    </div>
  </div>

  <script>
    const SEASON_DATA = {
      spring: {
        name: "봄",
        emoji: "🌸",
        weathers: [
          { emoji: "☀️", title: "따뜻하고 포근해요", desc: "얼었던 땅이 녹고 따뜻한 바람이 불어요" },
          { emoji: "😷", title: "황사가 불어와요", desc: "봄바람을 타고 노란 모래바람이 날아와요" },
          { emoji: "🌷", title: "꽃샘추위와 봄비", desc: "따뜻해지다가도 잠깐 쌀쌀해지기도 해요" }
        ]
      },
      summer: {
        name: "여름",
        emoji: "🌻",
        weathers: [
          { emoji: "🌡️", title: "무덥고 햇볕이 쨍쨍해요", desc: "기온이 아주 높고 더운 날이 이어져요" },
          { emoji: "☔", title: "장마와 소나기", desc: "비가 오랫동안 내리거나 갑자기 쏟아져요" },
          { emoji: "🌀", title: "태풍이 찾아와요", desc: "강한 바람이 불고 많은 비가 내려요" }
        ]
      },
      autumn: {
        name: "가을",
        emoji: "🍁",
        weathers: [
          { emoji: "🌬️", title: "선선한 바람이 불어요", desc: "더위가 물러가고 시원해서 활동하기 좋아요" },
          { emoji: "☀️", title: "하늘이 높고 맑아요", desc: "구름이 적고 파란 하늘이 높게 보여요" },
          { emoji: "🧥", title: "아침저녁으로 쌀쌀해요", desc: "낮에는 따뜻하지만 아침과 밤엔 기온이 낮아요" }
        ]
      },
      winter: {
        name: "겨울",
        emoji: "⛄",
        weathers: [
          { emoji: "🥶", title: "춥고 찬 바람이 불어요", desc: "기온이 낮아지고 날씨가 매섭게 추워요" },
          { emoji: "❄️", title: "하얀 눈이 내려요", desc: "하늘에서 눈이 내리고 물이 꽁꽁 얼어요" },
          { emoji: "🧊", title: "건조하고 맑은 날씨", desc: "공기가 메마르고 차가운 바람이 불어요" }
        ]
      }
    };

    let itemsPerSeason = 2; // 2 (8쌍=16장) or 3 (12쌍=24장)
    let showBackHint = true;
    let soundEnabled = true;
    let deck = [];
    let flippedCards = [];
    let lockBoard = false;
    let matchedPairs = 0;
    let moveCount = 0;
    let collectedBySeason = { spring: [], summer: [], autumn: [], winter: [] };

    // Web Audio API 간단 효과음
    let audioCtx = null;
    function playTone(type) {
      if (!soundEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === "flip") {
          osc.frequency.setValueAtTime(420, now);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === "match") {
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.1);
          osc.frequency.setValueAtTime(783.99, now + 0.2);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
          osc.start(now);
          osc.stop(now + 0.38);
        } else if (type === "miss") {
          osc.frequency.setValueAtTime(280, now);
          osc.frequency.setValueAtTime(220, now + 0.12);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.start(now);
          osc.stop(now + 0.25);
        }
      } catch (e) {}
    }

    function setMode(count) {
      itemsPerSeason = count;
      document.getElementById("mode-8").classList.toggle("active", count === 2);
      document.getElementById("mode-12").classList.toggle("active", count === 3);
      initGame();
    }

    function toggleBackHint() {
      showBackHint = !showBackHint;
      const btn = document.getElementById("hint-toggle");
      btn.textContent = showBackHint ? "뒷면 구분: 켜짐" : "뒷면 구분: 꺼짐";
      btn.classList.toggle("active", showBackHint);
      document.getElementById("guide-row").style.visibility = showBackHint ? "visible" : "hidden";
      renderBoard();
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      const btn = document.getElementById("sound-toggle");
      btn.textContent = soundEnabled ? "🔊 소리 켜짐" : "🔇 소리 꺼짐";
      btn.classList.toggle("active", soundEnabled);
    }

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function initGame() {
      flippedCards = [];
      lockBoard = false;
      matchedPairs = 0;
      moveCount = 0;
      collectedBySeason = { spring: [], summer: [], autumn: [], winter: [] };

      const totalPairs = itemsPerSeason * 4;
      document.getElementById("matched-count").textContent = "0";
      document.getElementById("total-pairs").textContent = String(totalPairs);
      document.getElementById("move-count").textContent = "0";

      const fb = document.getElementById("feedback");
      fb.className = "feedback-banner";
      fb.textContent = "계절 카드(⭐) 1장과 날씨 카드(☁️) 1장을 뒤집어 알맞은 계절과 날씨를 연결해 보세요!";

      const cards = [];
      let idCounter = 1;

      Object.keys(SEASON_DATA).forEach((seasonKey) => {
        const s = SEASON_DATA[seasonKey];
        for (let i = 0; i < itemsPerSeason; i++) {
          const w = s.weathers[i];
          // 계절 카드
          cards.push({
            id: idCounter++,
            seasonKey: seasonKey,
            seasonName: s.name,
            cardType: "season",
            emoji: s.emoji,
            title: s.name,
            desc: `${s.name}에 알맞은 날씨를 찾아봐요`,
            matched: false,
            flipped: false
          });
          // 날씨 현상 카드
          cards.push({
            id: idCounter++,
            seasonKey: seasonKey,
            seasonName: s.name,
            cardType: "weather",
            emoji: w.emoji,
            title: w.title,
            desc: w.desc,
            matched: false,
            flipped: false
          });
        }
      });

      deck = shuffle(cards);
      updateSeasonBoxes();
      renderBoard();
    }

    function renderBoard() {
      const board = document.getElementById("game-board");
      board.className = "board-container " + (itemsPerSeason === 2 ? "board-4x4" : "board-6x4");
      board.innerHTML = "";

      deck.forEach((card, index) => {
        const cardEl = document.createElement("div");
        cardEl.className = "card" + (card.flipped ? " flipped" : "") + (card.matched ? " matched" : "");
        cardEl.onclick = () => onCardClick(index);

        let backClass = "card-face card-back";
        let backIcon = "❓";
        let backLabel = "뒤집어 보기";

        if (showBackHint) {
          if (card.cardType === "season") {
            backClass += " season-hint";
            backIcon = "⭐";
            backLabel = "계절 카드";
          } else {
            backClass += " weather-hint";
            backIcon = "☁️";
            backLabel = "날씨 카드";
          }
        }

        const tagText = card.cardType === "season" ? "계절" : "기온·날씨";

        cardEl.innerHTML = `
          <div class="card-inner">
            <div class="${backClass}">
              <div class="card-back-icon">${backIcon}</div>
              <div class="card-back-label">${backLabel}</div>
            </div>
            <div class="card-face card-front ${card.seasonKey}">
              <span class="card-tag">${tagText}</span>
              <div class="card-emoji">${card.emoji}</div>
              <div class="card-title">${card.title}</div>
              <div class="card-desc">${card.desc}</div>
            </div>
          </div>
        `;
        board.appendChild(cardEl);
      });
    }

    function onCardClick(index) {
      if (lockBoard) return;
      const clicked = deck[index];
      if (clicked.flipped || clicked.matched) return;

      playTone("flip");
      clicked.flipped = true;
      flippedCards.push(clicked);
      renderBoard();

      if (flippedCards.length === 2) {
        lockBoard = true;
        moveCount++;
        document.getElementById("move-count").textContent = String(moveCount);
        checkMatch();
      }
    }

    function checkMatch() {
      const [c1, c2] = flippedCards;
      const fb = document.getElementById("feedback");

      const isOneSeasonOneWeather = c1.cardType !== c2.cardType;
      const isSameSeason = c1.seasonKey === c2.seasonKey;

      if (isOneSeasonOneWeather && isSameSeason) {
        c1.matched = true;
        c2.matched = true;
        matchedPairs++;
        playTone("match");

        const weatherCard = c1.cardType === "weather" ? c1 : c2;
        collectedBySeason[c1.seasonKey].push(`${weatherCard.emoji} ${weatherCard.title}`);
        updateSeasonBoxes();

        document.getElementById("matched-count").textContent = String(matchedPairs);
        fb.className = "feedback-banner success";
        fb.textContent = `딩동댕! [${c1.seasonName}] 계절과 [${weatherCard.title}] 날씨를 바르게 연결했어요!`;

        flippedCards = [];
        lockBoard = false;
        renderBoard();

        if (matchedPairs === itemsPerSeason * 4) {
          setTimeout(showWinModal, 500);
        }
      } else {
        playTone("miss");
        fb.className = "feedback-banner retry";
        if (!isOneSeasonOneWeather) {
          fb.textContent = "앗! 계절 카드(⭐) 1장과 날씨 카드(☁️) 1장을 하나씩 골라 짝지어 보세요!";
        } else {
          const seasonCard = c1.cardType === "season" ? c1 : c2;
          const weatherCard = c1.cardType === "weather" ? c1 : c2;
          fb.textContent = `[${weatherCard.title}] 날씨는 [${seasonCard.seasonName}] 날씨가 아니에요. 다시 찾아볼까요?`;
        }

        setTimeout(() => {
          c1.flipped = false;
          c2.flipped = false;
          flippedCards = [];
          lockBoard = false;
          renderBoard();
        }, 1250);
      }
    }

    function updateSeasonBoxes() {
      ["spring", "summer", "autumn", "winter"].forEach((key) => {
        const listEl = document.getElementById(`list-${key}`);
        const countEl = document.getElementById(`count-${key}`);
        const items = collectedBySeason[key];
        countEl.textContent = `${items.length} / ${itemsPerSeason}개`;
        listEl.innerHTML = items.map(item => `<div class="collected-item">${item}</div>`).join("");
      });
    }

    function showWinModal() {
      const modal = document.getElementById("win-modal");
      const msg = document.getElementById("win-message");
      msg.innerHTML = `총 <strong>${moveCount}번</strong> 만에 사계절 날씨 <strong>${matchedPairs}쌍</strong>을 모두 찾았어요!<br>봄·여름·가을·겨울의 기온과 날씨 특징을 완벽하게 익혔네요!`;
      modal.classList.add("show");
    }

    function closeModalAndRestart() {
      document.getElementById("win-modal").classList.remove("show");
      initGame();
    }

    initGame();
  </script>
</body>
</html>
